# The checks of the app on every push to master and every pull request: the unit tests with coverage, the static
# analyzer of Xcode and SwiftLint, and Pantrix MQ's verdict on what they found.
#
# pmq comes from GitHub Packages of developersancho/pantrix-mq, in the version that .github/pantrix-mq.version names.
# MQ_PACKAGES_TOKEN is a token that only reads packages. A pull request from a fork has no secrets: its checks run,
# and MQ does not.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes the run for the older one pointless. On master every run is kept.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests, analyze, SwiftLint and MQ
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      # For MQ's store of baselines: the artifacts master's runs left, which pmq lists and downloads.
      actions: read
      # For MQ's verdict: a check on the commit, and on a pull request a comment that every run updates.
      checks: write
      pull-requests: write
    env:
      GPR_USER: ${{ github.repository_owner }}
      GPR_TOKEN: ${{ secrets.MQ_PACKAGES_TOKEN }}
      PROJECT: PantrixRortySwiftUI.xcodeproj
      SCHEME: PantrixRortySwiftUI-Debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: MQ measures a pull request from where it left master, and looks back through master
          # for the nearest commit its store holds the analysis of.
          fetch-depth: 0
      # pmq runs on Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - name: An iPhone simulator
        # The names of the simulators an image has change with it; the first iPhone of the newest iOS is as good as any.
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime
                     for d in devices[runtime] if d["name"].startswith("iPhone")))')"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
      # A clean build each, and apart: MQ reads the warnings of a build that compiled everything, and the analyzer's
      # of an analyze of its own.
      - name: The unit tests with coverage
        run: >
          xcodebuild clean test -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath build/DerivedData -resultBundlePath build/Test.xcresult
          -enableCodeCoverage YES -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
      - name: The static analyzer of Xcode
        if: ${{ !cancelled() }}
        run: >
          xcodebuild clean analyze -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath build/DerivedData -resultBundlePath build/Analyze.xcresult CODE_SIGNING_ALLOWED=NO
      # TRIAL, not to be merged: the build results of both result bundles, with the probes of MQ's fixtures in the
      # targets, as the command pmq analyze runs prints them.
      - name: The build results of both result bundles, for a trial of MQ's reading of them
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool version
          for bundle in build/Test.xcresult build/Analyze.xcresult; do
            echo "== $bundle"
            xcrun xcresulttool get build-results --schema-version 0.1.0 --path "$bundle" --compact
            echo
          done
          echo "== tests of build/Test.xcresult"
          xcrun xcresulttool get test-results tests --schema-version 0.1.0 --path build/Test.xcresult --compact
          echo
      - name: SwiftLint
        if: ${{ !cancelled() }}
        # SwiftLint ends with a status other than 0 when a rule of the error level is broken; its report is written
        # all the same, and MQ judges it.
        run: |
          command -v swiftlint > /dev/null || brew install swiftlint
          swiftlint lint --reporter sarif --quiet > build/swiftlint.sarif || true
      - name: pmq, from GitHub Packages
        if: ${{ !cancelled() && env.GPR_TOKEN != '' }}
        run: |
          version="$(cat .github/pantrix-mq.version)"
          base="https://maven.pkg.github.com/developersancho/pantrix-mq/io/github/developersancho/pantrix/mq"
          curl -fsSL -u "$GPR_USER:$GPR_TOKEN" -o "$RUNNER_TEMP/pmq.zip" \
            "$base/pantrix-mq-scanner-cli/$version/pantrix-mq-scanner-cli-$version.zip"
          unzip -q "$RUNNER_TEMP/pmq.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmq-$version/bin" >> "$GITHUB_PATH"
      # MQ's store of baselines is a directory outside the checkout. A run of a push to master keeps its analysis in it
      # and uploads what it kept as an artifact named mq-baselines; every run brings the baselines of the commits
      # before it back from those artifacts, and takes one only from a run of a push to master in this repository.
      - name: MQ's store of baselines, from the artifacts master's runs left
        if: ${{ !cancelled() && env.GPR_TOKEN != '' }}
        run: pmq baselines fetch --github --into "$RUNNER_TEMP/mq-baselines"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: MQ's analysis of the iOS part
        if: ${{ !cancelled() && env.GPR_TOKEN != '' }}
        run: >
          pmq analyze --project rorty-ios --source Sources --source Tests
          --swiftlint build/swiftlint.sarif --xcresult build/Test.xcresult --analyzer-xcresult build/Analyze.xcresult
          --app build/DerivedData/Build/Products/Debug-iphonesimulator/PantrixRortySwiftUI.app
          --baselines "$RUNNER_TEMP/mq-baselines"
      - name: MQ's verdict
        id: verdict
        if: ${{ !cancelled() && env.GPR_TOKEN != '' && hashFiles('build/mq/ios.mqr') != '' }}
        # The verdict is MQ's check, which says it once: the step fails only when MQ could not judge at all (1), and
        # not when the gate failed (2) or is incomplete (3). Master keeps its analysis, which its pull requests are
        # compared with.
        run: |
          status=0
          pmq finalize \
            --bundle build/mq/ios.mqr \
            --baselines "$RUNNER_TEMP/mq-baselines" \
            --summary "$GITHUB_STEP_SUMMARY" \
            $MQ_KEEP --github || status=$?
          if [ "$status" -eq 2 ] || [ "$status" -eq 3 ]; then status=0; fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MQ_KEEP: ${{ github.event_name == 'push' && '--keep' || '' }}
      - name: MQ's baseline of this commit, for the runs after it
        # Whatever the gate said: the analysis is kept all the same. Only what finalize kept of this commit goes, the
        # bundle and the events, and a later run fetches it from here.
        if: ${{ !cancelled() && github.event_name == 'push' && steps.verdict.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mq-baselines
          path: ${{ runner.temp }}/mq-baselines/v0/**/${{ github.sha }}.*
          # A run that kept nothing says why in the log of its verdict; the warning points there.
          if-no-files-found: warn
          retention-days: 90
